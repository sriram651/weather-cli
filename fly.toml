# fly.toml app configuration file generated for weather-cli on 2026-04-12T16:27:48+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'weather-cli'
primary_region = 'bom'

[build]
  [build.args]
    GO_VERSION = '1.19'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
